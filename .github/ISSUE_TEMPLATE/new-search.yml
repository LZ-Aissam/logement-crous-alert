name: Nouvelle recherche de logement
description: Ajoute une nouvelle recherche CROUS a surveiller (ville + filtres optionnels)
title: "[Nouvelle recherche] "
labels: ["new-search"]
body:
  - type: input
    id: name
    attributes:
      label: Nom de la recherche
      description: Un nom court et unique pour identifier cette recherche (ex. "Brest", "Rennes Kergoat")
      placeholder: Brest
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: Ville
      description: Ville (et code postal si tu veux etre precis), ex. "Brest" ou "Brest 29200"
      placeholder: Brest 29200
    validations:
      required: true
  - type: input
    id: keywords
    attributes:
      label: Mots-clés (résidence, type de logement...) - optionnel
      description: >-
        Separes par des virgules (ex. "Kergoat, studio, chambre grand confort").
        Un logement doit correspondre a au moins un mot-cle pour declencher une alerte.
        Laisse vide pour recevoir toutes les annonces de cette ville.
      placeholder: Kergoat, studio
    validations:
      required: false
  - type: input
    id: emails
    attributes:
      label: Email(s) de notification - optionnel
      description: >-
        Separes par des virgules (max 3). Laisse vide pour utiliser l'email par
        defaut. Chaque adresse recevra un email de confirmation a valider avant de
        recevoir des alertes.
      placeholder: toi@example.com
    validations:
      required: false
  - type: input
    id: extent
    attributes:
      label: Zone geographique precise (rempli automatiquement) - optionnel
      description: >-
        Normalement rempli automatiquement par le formulaire public quand tu
        selectionnes une suggestion. Laisse vide pour une soumission manuelle -- la
        recherche utilisera la ville renseignee ci-dessus avec une zone par defaut.
    validations:
      required: false
  - type: input
    id: maxPrice
    attributes:
      label: Prix maximum - optionnel
      description: En euros. Laisse vide pour aucune limite de prix.
      placeholder: "400"
    validations:
      required: false
  - type: input
    id: minArea
    attributes:
      label: Surface minimum en m2 - optionnel
      description: Laisse vide pour aucune limite de surface.
      placeholder: "15"
    validations:
      required: false
  - type: input
    id: occupationMode
    attributes:
      label: Type de cohabitation (individuel, couple, colocation) - optionnel
      description: >-
        Separes par des virgules parmi : individuel, couple, colocation. Laisse
        vide pour ne pas filtrer par type de cohabitation.
      placeholder: individuel, colocation
    validations:
      required: false
  - type: input
    id: prm
    attributes:
      label: Logement adapte PMR - optionnel
      description: Ecris "oui" pour ne voir que les logements adaptes PMR. Laisse vide sinon.
      placeholder: "oui"
    validations:
      required: false

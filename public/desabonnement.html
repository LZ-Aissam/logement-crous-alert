<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se desinscrire - Alerte logement CROUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body style="background: var(--color-grey); min-height: 100vh;">

<nav class="navbar navbar-expand py-3">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2 mb-0" href="index.html">
      <i class="bi bi-house-heart-fill"></i>
      Alerte Logement CROUS
    </a>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-lg p-4 p-md-5 reveal is-visible">
        <span class="stamp stamp-teal mb-3">Désinscription</span>
        <h1 class="h3 fw-bold mt-3 mb-2">Se désinscrire</h1>
        <p id="intro" class="text-secondary">Clique sur le bouton ci-dessous pour ne plus recevoir d'alertes pour cette recherche.</p>

        <div class="honeypot" aria-hidden="true">
          <label for="website">Laisse ce champ vide</label>
          <input id="website" tabindex="-1" autocomplete="off">
        </div>

        <button id="unsubscribe-button" type="button" class="btn btn-primary btn-lg w-100 rounded-pill mt-3">Se désinscrire</button>
        <div id="result" class="alert d-none mt-4 mb-0" role="status"></div>
      </div>
    </div>
  </div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const search = params.get("search");
  const email = params.get("email");
  const token = params.get("token");
  const button = document.getElementById("unsubscribe-button");
  const result = document.getElementById("result");
  const intro = document.getElementById("intro");
  const website = document.getElementById("website");

  if (!search || !email || !token) {
    button.disabled = true;
    result.textContent = "Lien invalide : informations manquantes dans l'URL.";
    result.className = "alert alert-danger mt-4 mb-0";
  } else {
    intro.textContent = 'Se désinscrire de la recherche "' + search + '" pour l\'adresse ' + email + ' ?';
  }

  button.addEventListener("click", async () => {
    button.disabled = true;
    result.className = "alert d-none mt-4 mb-0";

    try {
      const response = await fetch("/.netlify/functions/unsubscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ search, email, token, website: website.value }),
      });
      const data = await response.json();

      if (!response.ok) {
        result.textContent = data.error || "Une erreur est survenue.";
        result.className = "alert alert-danger mt-4 mb-0";
        button.disabled = false;
        return;
      }

      result.textContent = "Désinscription envoyée.";
      result.className = "alert alert-success mt-4 mb-0";
    } catch (err) {
      result.textContent = "Une erreur est survenue, réessaie dans quelques minutes.";
      result.className = "alert alert-danger mt-4 mb-0";
      button.disabled = false;
    }
  });
</script>
</body>
</html>
